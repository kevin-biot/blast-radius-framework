name: Validate BRF evidence utilities

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install local runtimes
        run: |
          bash tools/install-jsonschema-local.sh
          bash tools/install-integrations-local.sh
          python3 tools/install_opa_local.py
          python3 tools/install_acs_runtime.py
      - name: Fetch pinned upstream data
        run: |
          python3 tools/fetch_acs_schemas.py
          python3 tools/fetch_acs_trace_assets.py
          python3 tools/fetch_cyclonedx_schemas.py
      - name: Run offline checks and native integrations
        run: bash tools/check-alignment-local.sh
      - name: Retain fixture-only evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brf-fixture-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
          path: |
            .tools/alignment-check.*/acs-trace.json
            .tools/alignment-check.*/opa-comparison.json
            .tools/alignment-check.*/inspect-evidence.json
            .tools/alignment-check.*/acs-live/evidence.json
            .tools/alignment-check.*/async-boundary/evidence.json
            .tools/alignment-check.*/acs-live/*/envelopes.jsonl
            .tools/alignment-check.*/acs-live/*/audit.jsonl
            .tools/alignment-check.*/acs-live/*/trace.jsonl
            .tools/alignment-check.*/acs-live/*/host-trace.jsonl
            .tools/alignment-check.*/acs-live/*/trace-analysis.json
            .tools/alignment-check.*/portability/evidence.json
            .tools/alignment-check.*/portability/evidence.dsse.json
            .tools/alignment-check.*/portability/inventory-links.json
            .tools/alignment-check.*/portability/inventory-links.dsse.json
            .tools/alignment-check.*/portability/demo-public.pem
